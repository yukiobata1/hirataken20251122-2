<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F8F9F9; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 15pt 30pt; }
.header h1 { color: #ffffff; font-size: 22pt; margin: 0; }
.content { padding: 25pt 35pt; flex: 1; }
h2 { color: #1C2833; font-size: 16pt; margin: 0 0 12pt 0; }
p { color: #2C3E50; font-size: 13pt; margin: 0 0 15pt 0; line-height: 1.5; }
.highlight { background: #E8F6F3; padding: 15pt; border-left: 4pt solid #16A085; margin-top: 15pt; }
.highlight p { margin: 0; color: #1C2833; }
ul { color: #2C3E50; font-size: 13pt; margin: 0; padding-left: 20pt; }
li { margin-bottom: 8pt; }
</style>
</head>
<body>
<div class="header"><h1>背景と目的</h1></div>
<div class="content">
  <h2>液体Gaの特異な構造</h2>
  <p>液体ガリウムの構造因子S(Q)には、Q = 2.8-3.5 A付近に特徴的な「肩」構造が存在する。これは単一のLJポテンシャルでは再現できない。</p>

  <h2>研究目的</h2>
  <ul>
    <li>2元LJポテンシャルモデルで肩構造を再現</li>
    <li>Gaの局所構造に2種類の環境が共存することを検証</li>
    <li>最適パラメータの探索とVoronoi解析による構造理解</li>
  </ul>

  <div class="highlight">
    <p>仮説: Gaには「コンパクト」と「開かれた」2つの局所環境が共存</p>
  </div>
</div>
</body>
</html>
