<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F8F9F9; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #1C2833; padding: 12pt 30pt; }
.header h1 { color: #ffffff; font-size: 20pt; margin: 0; }
.content { padding: 12pt 20pt; flex: 1; display: flex; gap: 15pt; }
.left { width: 170pt; }
.right { flex: 1; display: flex; justify-content: center; align-items: center; }
h2 { color: #1C2833; font-size: 12pt; margin: 0 0 10pt 0; }
p { color: #2C3E50; font-size: 10pt; margin: 0 0 6pt 0; line-height: 1.4; }
ul { color: #2C3E50; font-size: 10pt; margin: 0; padding-left: 14pt; }
li { margin-bottom: 5pt; }
.insight-box { background: #E8F6F3; padding: 8pt; border-radius: 4pt; margin-top: 10pt; }
.insight-box p { color: #1C2833; margin: 0; font-size: 10pt; }
.image-placeholder { width: 330pt; height: 260pt; background: #cccccc; }
</style>
</head>
<body>
<div class="header"><h1>結果: パラメータ依存性</h1></div>
<div class="content">
  <div class="left">
    <h2>傾向</h2>
    <ul>
      <li>シグマ12 = 1.15-1.17倍が最適ゾーン</li>
      <li>Ga1 &lt; 50%でR因子改善</li>
      <li>肩領域にはシグマ12 = 1.17倍が効果的</li>
    </ul>
    <div class="insight-box">
      <p><b>洞察:</b> Ga2（大きい原子）がやや優勢な系で肩構造が良く再現される</p>
    </div>
  </div>
  <div class="right">
    <div id="chart2" class="placeholder image-placeholder"></div>
  </div>
</div>
</body>
</html>
